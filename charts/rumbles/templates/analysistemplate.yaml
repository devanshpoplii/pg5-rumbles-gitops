{{- if .Values.rollout.strategy.canary.analysis.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ .Values.rollout.strategy.canary.analysis.templateName }}
  labels:
    {{- include "rumbles.labels" . | nindent 4 }}
spec:
  {{- if eq .Values.analysis.provider "cloudwatch" }}
  # Args passed in by the Rollout from its status.alb.* fields at analysis time:
  # the dynamically-created canary target group name and the parent load balancer
  # dimension, used to scope the CloudWatch query to the canary only.
  args:
    - name: canary-tg
    - name: lb
  {{- end }}
  metrics:
    {{- if eq .Values.analysis.provider "web" }}
    # Simple health-based gate: polls the canary /health endpoint and requires
    # an HTTP 200. Good default for a demo; swap to cloudwatch/datadog for prod signals.
    - name: health-check
      interval: {{ .Values.analysis.web.intervalSeconds }}s
      count: {{ .Values.analysis.web.count }}
      failureLimit: {{ .Values.analysis.web.failureLimit }}
      successCondition: "result == true"
      provider:
        web:
          url: "http://{{ include "rumbles.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.port }}{{ .Values.probes.path }}"
          jsonPath: "{$.status}"
    {{- else if eq .Values.analysis.provider "cloudwatch" }}
    # CloudWatch gate on the CANARY target group's own 5XX error rate.
    # The canary target group is created dynamically by the LB Controller during
    # the rollout; Argo Rollouts passes its full dimension name and the parent LB
    # dimension into this template as args (wired in the Rollout's analysis.args
    # via valueFrom.fieldRef on status.alb.*). Requires the Rollouts controller
    # to have CloudWatch read (IRSA).
    - name: canary-5xx-rate
      interval: {{ .Values.analysis.cloudwatch.intervalSeconds }}s
      count: {{ .Values.analysis.cloudwatch.count }}
      # error rate = canary 5XX / canary request count. Empty (no traffic yet) is
      # treated as success so the gate doesn't fail before data arrives.
      successCondition: "isNaN(result) || result < {{ .Values.analysis.cloudwatch.errorRateThreshold }}"
      failureLimit: {{ .Values.analysis.cloudwatch.failureLimit }}
      provider:
        cloudWatch:
          metricDataQueries:
            - id: errorRate
              expression: "IF(requests > 0, errors / requests, 0)"
            - id: errors
              returnData: false
              metricStat:
                metric:
                  namespace: AWS/ApplicationELB
                  metricName: HTTPCode_Target_5XX_Count
                  dimensions:
                    - name: TargetGroup
                      value: "{{ `{{args.canary-tg}}` }}"
                    - name: LoadBalancer
                      value: "{{ `{{args.lb}}` }}"
                period: 60
                stat: Sum
            - id: requests
              returnData: false
              metricStat:
                metric:
                  namespace: AWS/ApplicationELB
                  metricName: RequestCount
                  dimensions:
                    - name: TargetGroup
                      value: "{{ `{{args.canary-tg}}` }}"
                    - name: LoadBalancer
                      value: "{{ `{{args.lb}}` }}"
                period: 60
                stat: Sum
    {{- else if eq .Values.analysis.provider "datadog" }}
    # Datadog gate: promotion continues only while the error query stays low.
    # Requires a Datadog API/App key secret in the rollouts namespace.
    - name: datadog-error-rate
      interval: {{ .Values.analysis.datadog.intervalSeconds }}s
      count: {{ .Values.analysis.datadog.count }}
      successCondition: "result < 5"
      failureLimit: 1
      provider:
        datadog:
          apiVersion: v2
          query: {{ .Values.analysis.datadog.query | quote }}
    {{- end }}
{{- end }}
