apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "rumbles.fullname" . }}
  labels:
    {{- include "rumbles.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "rumbles.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rumbles.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        # distroless "nonroot" user is UID 65532. Kubernetes can only verify
        # runAsNonRoot from a NUMERIC uid (it can't resolve the image's named
        # user), so we set it explicitly — otherwise the pod fails to start with
        # "image has non-numeric user (nonroot), cannot verify user is non-root".
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rumbles
          image: {{ include "rumbles.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.probes.port }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: {{ .Values.probes.port }}
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: {{ .Values.probes.port }}
            initialDelaySeconds: 5
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
  strategy:
    canary:
      {{- if .Values.trafficRouting.enabled }}
      # Level 2: Rollouts manages these two services' selectors (stable vs canary)
      # and injects the weighted-action annotation on the Ingress to split real
      # ALB traffic between their target groups per the current setWeight.
      canaryService: {{ include "rumbles.fullname" . }}-canary
      stableService: {{ include "rumbles.fullname" . }}-stable
      trafficRouting:
        alb:
          ingress: {{ include "rumbles.fullname" . }}
          servicePort: {{ .Values.service.port }}
      {{- end }}
      steps:
        {{- range .Values.rollout.strategy.canary.steps }}
        {{- if hasKey . "setWeight" }}
        - setWeight: {{ .setWeight }}
        {{- else if hasKey . "pause" }}
        - pause:
            {{- if .pause.duration }}
            duration: {{ .pause.duration }}
            {{- end }}
        {{- end }}
        {{- end }}
      {{- if .Values.rollout.strategy.canary.analysis.enabled }}
      analysis:
        startingStep: {{ .Values.rollout.strategy.canary.analysis.startingStep }}
        templates:
          - templateName: {{ .Values.rollout.strategy.canary.analysis.templateName }}
        {{- if eq .Values.analysis.provider "cloudwatch" }}
        # Pass the dynamically-created canary target group + load balancer
        # dimensions from the Rollout status into the AnalysisTemplate, so the
        # CloudWatch query measures the CANARY target group's own 5XX rate.
        args:
          - name: canary-tg
            valueFrom:
              fieldRef:
                fieldPath: status.alb.canaryTargetGroup.fullName
          - name: lb
            valueFrom:
              fieldRef:
                fieldPath: status.alb.loadBalancer.fullName
        {{- end }}
      {{- end }}
