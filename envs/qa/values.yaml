# QA environment overrides.
# QA is a real progressive rollout: stepped canary weights, a bake/observation
# pause, and a health-based analysis gate that auto-aborts (rolls back) on failure.
# Same Rollout object as dev — only the strategy and image digest differ.

replicaCount: 3
image:
  # Real ECR repo. The pipeline writes the immutable digest below on promotion.
  repository: "849445096948.dkr.ecr.eu-north-1.amazonaws.com/rumbles"
  # The pipeline writes the immutable digest here on promotion to qa.
  digest: "sha256:0ced6a95e93444d7c9cc6a598431c9549e2707636c17085eb8049d750b682d42"
  tag: "34a21f062a05"
rollout:
  strategy:
    type: canary
    canary:
      steps:
        - setWeight: 10
        # Bake / observation period before analysis begins.
        - pause:
            duration: 2m
        - setWeight: 25
        - pause:
            duration: 5m
        - setWeight: 50
        - pause:
            duration: 5m
        - setWeight: 100
      analysis:
        enabled: true
        templateName: rumbles-health
        # Begin analysis after the first weight step (index 1).
        startingStep: 1
# QA is exposed via an internet-facing ALB. This both serves traffic and makes
# the ALB emit CloudWatch metrics (RequestCount, 5XX, latency) used by the gate.
ingress:
  enabled: true
  securityGroup: "sg-0e3b2c025281a338a"

# Level 2: real ALB weighted traffic splitting between stable and canary target
# groups, so the canary's own CloudWatch metrics can be measured in isolation.
trafficRouting:
  enabled: true

# Health gate: gate the QA canary on the canary target group's own 5XX error
# rate from CloudWatch (real ALB signal), auto-rolling back if it exceeds the
# threshold. Requires the Rollouts controller to have CloudWatch read (IRSA).
analysis:
  provider: cloudwatch
  cloudwatch:
    intervalSeconds: 60
    count: 5
    failureLimit: 1
    errorRateThreshold: 0.05
