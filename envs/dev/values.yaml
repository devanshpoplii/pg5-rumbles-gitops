# Dev environment overrides.
# Dev prioritizes fast feedback: a single canary step straight to 100%, no gates.
# Same Rollout object as qa — only the strategy and image digest differ.

replicaCount: 1

image:
  # Real ECR repo. The pipeline writes the immutable digest below on each build.
  repository: "849445096948.dkr.ecr.eu-north-1.amazonaws.com/rumbles"
  # The pipeline writes the immutable digest here. Empty falls back to tag.
  digest: ""
  tag: "dev"

rollout:
  strategy:
    type: canary
    canary:
      steps:
        - setWeight: 100
      analysis:
        enabled: false
