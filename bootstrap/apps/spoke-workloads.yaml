apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: spoke-workloads
  namespace: argocd
  # Keep the project even if the bootstrap app is deleted, to avoid orphaning apps.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Workloads deployed from the pg5-rumbles-gitops repo to the spoke clusters

  # Namespaces allowed to contain Applications/ApplicationSets that reference
  # this project. REQUIRED by the EKS Argo CD capability (unlike OSS Argo CD,
  # where it is optional). The rumbles ApplicationSet creates its Applications
  # in the argocd namespace, so argocd must be listed here — otherwise apps get
  # "is not permitted to use project 'spoke-workloads'".
  sourceNamespaces:
    - argocd

  # Only this repo may be used as an Application source in this project.
  sourceRepos:
    - https://github.com/devanshpoplii/pg5-rumbles-gitops.git

  # Allowed deployment destinations. Isolation is by PHYSICAL CLUSTER (dev spoke
  # vs qa spoke), not by namespace — so the app uses the same "rumbles"
  # namespace on both clusters, and we whitelist the two spoke clusters by their
  # EKS cluster ARN.
  destinations:
    - name: dev-cluster
      server: "arn:aws:eks:eu-north-1:849445096948:cluster/dev-cluster"
      namespace: rumbles
    - name: qa-cluster
      server: "arn:aws:eks:eu-north-1:849445096948:cluster/qa-cluster"
      namespace: rumbles

  # Allow the cluster-scoped and namespaced resources this chart needs.
  # Allow all resource kinds (cluster- and namespace-scoped). We are not
  # exercising AppProject resource restrictions in this demo, so the "*" wildcard
  # avoids having to allow-list each kind (Ingress, ReplicaSet, Pod, etc.).
  # For a real production project, replace these with an explicit allow-list.
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"

  # RBAC role used by CI/CD pipelines to sync qa (least-privilege token).
  roles:
    - name: ci-pipeline
      description: Token role for the promotion pipeline to sync applications
      policies:
        - p, proj:spoke-workloads:ci-pipeline, applications, get, spoke-workloads/*, allow
        - p, proj:spoke-workloads:ci-pipeline, applications, sync, spoke-workloads/*, allow
