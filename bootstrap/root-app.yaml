apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rumbles-bootstrap
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  # Bootstrap runs in the default project (it manages the spoke-workloads project itself).
  project: default
  source:
    repoURL: https://github.com/devanshpoplii/pg5-rumbles-gitops.git
    targetRevision: main
    # Sync every manifest under bootstrap/apps (the AppProject and the
    # ApplicationSet). Using Argo CD native directory recursion avoids
    # kustomize's cross-directory file restriction. This is the single
    # object you apply once on the hub to bring up the control plane.
    path: bootstrap/apps
    directory:
      recurse: true
  destination:
    # The hub cluster, where the control-plane objects live. With the EKS
    # Capability the in-cluster default (https://kubernetes.default.svc) is
    # DISABLED, so we must target the hub by its registered EKS cluster ARN
    # (see clusters/hub-cluster.yaml).
    server: arn:aws:eks:eu-north-1:849445096948:cluster/hub-cluster
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
